<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="20" y="20" width="216" height="216" rx="48" fill="#4C1D95" stroke="#1A1423" stroke-width="12"/>
  <!-- Isometric Gold & Green Roblox-style Cubes -->
